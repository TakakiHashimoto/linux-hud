[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-hud"
version = "0.1.0"
description = "A lightweight Linux machine and network terminal HUD"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
linux-hud = "linux_hud.app:main"